<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <!-- Deep Foundry Void Background -->
  <rect width="1200" height="630" fill="#0b1326"/>
  
  <!-- Subtle Grid Pattern -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" opacity="0.6"/>
    </pattern>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.1"/>
    </linearGradient>
  </defs>
  
  <rect width="1200" height="630" fill="url(#grid)"/>
  
  <!-- Ambient Glow -->
  <circle cx="200" cy="150" r="300" fill="#2563eb" opacity="0.15" filter="blur(60px)"/>
  <circle cx="1000" cy="450" r="250" fill="#10b981" opacity="0.12" filter="blur(60px)"/>

  <!-- Top Badge: Made in India -->
  <g transform="translate(80, 70)">
    <rect width="360" height="38" rx="6" fill="#111c38" stroke="#2563eb" stroke-width="1.5"/>
    <circle cx="24" cy="19" r="6" fill="#10b981"/>
    <text x="40" y="24" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="14" font-weight="700" fill="#93c5fd" letter-spacing="1">🇮🇳 100% MADE IN INDIA • AIR-GAP MES</text>
  </g>

  <!-- Brand Logo & Name -->
  <g transform="translate(80, 140)">
    <rect width="64" height="48" rx="8" fill="url(#primaryGrad)"/>
    <text x="32" y="34" font-family="-apple-system, sans-serif" font-size="24" font-weight="900" fill="#ffffff" text-anchor="middle">कार्य</text>
    <text x="80" y="37" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="38" font-weight="900" fill="#ffffff" letter-spacing="2">KAARYA</text>
    <text x="260" y="37" font-family="'IBM Plex Mono', monospace" font-size="16" font-weight="600" fill="#64748b">/ SHOPFLOOR LEDGER</text>
  </g>

  <!-- Main Headline -->
  <text x="80" y="260" font-family="'Inter', -apple-system, sans-serif" font-size="52" font-weight="900" fill="#f8fafc" letter-spacing="-1">
    Digital Shopfloor Ledger
  </text>
  <text x="80" y="325" font-family="'Inter', -apple-system, sans-serif" font-size="52" font-weight="900" fill="#60a5fa" letter-spacing="-1">
    &amp; Real-Time OEE Software
  </text>

  <!-- Subheadline -->
  <text x="80" y="380" font-family="'Inter', -apple-system, sans-serif" font-size="20" font-weight="400" fill="#94a3b8">
    Local-first, single binary manufacturing execution for Indian CNC machine shops.
  </text>
  <text x="80" y="410" font-family="'Inter', -apple-system, sans-serif" font-size="20" font-weight="400" fill="#94a3b8">
    Hindi, தமிழ், తెలుగు, ಕನ್ನಡ, मराठी on operator tablets • IATF 16949 audit ready.
  </text>

  <!-- Shopfloor Metric Cards (Right Side) -->
  <g transform="translate(760, 180)">
    <rect width="360" height="260" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <rect width="360" height="44" rx="12" fill="#1e293b"/>
    <circle cx="24" cy="22" r="5" fill="#ef4444"/>
    <circle cx="40" cy="22" r="5" fill="#f59e0b"/>
    <circle cx="56" cy="22" r="5" fill="#10b981"/>
    <text x="76" y="27" font-family="'IBM Plex Mono', monospace" font-size="12" fill="#94a3b8">kaarya-node-1 ~ LIVE</text>

    <!-- Metrics inside card -->
    <text x="30" y="80" font-family="'IBM Plex Mono', monospace" font-size="12" fill="#64748b">PLANT OEE</text>
    <text x="30" y="125" font-family="'IBM Plex Mono', monospace" font-size="44" font-weight="800" fill="#10b981">87.4%</text>

    <line x1="30" y1="145" x2="330" y2="145" stroke="#334155" stroke-width="1"/>

    <text x="30" y="175" font-family="'IBM Plex Mono', monospace" font-size="11" fill="#64748b">AVAILABILITY</text>
    <text x="30" y="198" font-family="'IBM Plex Mono', monospace" font-size="18" font-weight="700" fill="#f8fafc">92.1%</text>

    <text x="145" y="175" font-family="'IBM Plex Mono', monospace" font-size="11" fill="#64748b">PERFORMANCE</text>
    <text x="145" y="198" font-family="'IBM Plex Mono', monospace" font-size="18" font-weight="700" fill="#f8fafc">95.4%</text>

    <text x="260" y="175" font-family="'IBM Plex Mono', monospace" font-size="11" fill="#64748b">QUALITY</text>
    <text x="260" y="198" font-family="'IBM Plex Mono', monospace" font-size="18" font-weight="700" fill="#10b981">99.2%</text>

    <text x="30" y="235" font-family="'IBM Plex Mono', monospace" font-size="11" fill="#3b82f6">● 100% OFFLINE AIR-GAP SYNC</text>
  </g>

  <!-- Bottom Strip -->
  <g transform="translate(80, 520)">
    <rect width="1040" height="50" rx="8" fill="#111c38" stroke="#1e293b" stroke-width="1"/>
    <text x="30" y="31" font-family="'IBM Plex Mono', monospace" font-size="14" font-weight="600" fill="#f8fafc">DOMAIN: kaayra.interstellarhq.in</text>
    <text x="440" y="31" font-family="'Inter', -apple-system, sans-serif" font-size="13" fill="#64748b">|</text>
    <text x="470" y="31" font-family="'Inter', -apple-system, sans-serif" font-size="13" font-weight="600" fill="#10b981">PUNE • BENGALURU • COIMBATORE • RAJKOT • NCR</text>
    <text x="940" y="31" font-family="'IBM Plex Mono', monospace" font-size="13" font-weight="700" fill="#60a5fa">CORE FREE</text>
  </g>
</svg>